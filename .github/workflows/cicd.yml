name: Build Image

# Required repository secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   SSH_USERNAME, SSH_PASSWORD
#   TELEGRAM_BOTTOKEN          - bot token
#   TELEGRAM_WEBHOOK_SECRET    - secret registered with setWebhook
#   SESSION_SECRET             - credential encryption key material
#   ADMIN_COMMAND_PASSWORD     - admin command password (NOT the Korail one)
#   REDIS_PASSWORD             - Redis AUTH password
#   ADMIN_USERID, ADMIN_PASSWD - optional Korail account for the magic login
#   ADMIN_MAGIC_STRING         - optional trigger for that shortcut
# Repository variables:
#   ALLOW_LIST

on:
    push:
        branches:
            - 'master'
    pull_request:
    workflow_dispatch:

jobs:
  # Nothing is published or deployed until this passes. Before it existed a
  # push to master went straight to the server with no test having run.
  check:
    runs-on: ubuntu-latest
    steps:
    -
        name: Checkout
        uses: actions/checkout@v4
    -
        name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
            enable-cache: true
    -
        name: Install dependencies
        run: uv sync --frozen
    -
        name: Lint
        run: |
            uv run --frozen ruff format --check .
            uv run --frozen ruff check .
    -
        name: Unit tests
        # No Docker needed: conftest.py starts the throwaway Redis only for
        # the integration and e2e suites.
        run: uv run --frozen pytest tests/unit -q
    -
        name: Integration and e2e tests
        # Not blocking yet. 16 of these fail on master and did so before the
        # toolchain work - they call service methods that no longer exist
        # (e.g. PaymentReminderService.deactivate_reminders). Drop
        # continue-on-error once that drift is repaired.
        continue-on-error: true
        run: uv run --frozen pytest tests/integration tests/e2e -q
    -
        name: Type check
        # Not blocking yet: 65 pre-existing errors, mostly str|None reaching
        # parameters typed int. Drop continue-on-error once they are cleared.
        continue-on-error: true
        run: uv run --frozen mypy

  cicd:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    -
        name: Checkout
        uses: actions/checkout@v4
    -
        name: Set up QEMU
        # Needed to build the arm64 image on an amd64 runner.
        uses: docker/setup-qemu-action@v3
    -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
    -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
    -
        name: Build Container Image
        uses: docker/build-push-action@v6
        with:
            context: .
            file: ./Dockerfile
            # arm64 as well as amd64, so the same published image runs on a
            # Raspberry Pi instead of only on the deployment server.
            platforms: linux/amd64,linux/arm64
            push: true
            tags: geunsam2/korailbot:latest
            cache-from: type=gha
            cache-to: type=gha,mode=max

    -
        name: Copy docker-compose.yml to server
        # Pinned to a release: @master would run whatever the action author
        # pushes next, with our deploy credentials.
        uses: appleboy/scp-action@v0.1.7
        with:
            host: server.geunsam2.xyz
            username: ${{ secrets.SSH_USERNAME }}
            password: ${{ secrets.SSH_PASSWORD }}
            port: 22
            source: "docker-compose.yml"
            target: "/home/${{ secrets.SSH_USERNAME }}/korail_bot/"

    -
        name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
            host: server.geunsam2.xyz
            username: ${{ secrets.SSH_USERNAME }}
            password: ${{ secrets.SSH_PASSWORD }}
            port: 22
            timeout: 60s
            script: |
                cd /home/${{ secrets.SSH_USERNAME }}/korail_bot || exit 1

                # Create .env file with secrets.
                # Quoted heredoc: secret values are written literally instead
                # of being expanded by the remote shell.
                umask 077
                cat > .env << 'EOF'
                BOTTOKEN=${{ secrets.TELEGRAM_BOTTOKEN }}
                TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
                SESSION_SECRET=${{ secrets.SESSION_SECRET }}
                ADMIN_PASSWORD=${{ secrets.ADMIN_COMMAND_PASSWORD }}
                ADMIN_MAGIC_STRING=${{ secrets.ADMIN_MAGIC_STRING }}
                USERID=${{ secrets.ADMIN_USERID }}
                USERPW=${{ secrets.ADMIN_PASSWD }}
                ALLOW_LIST=${{ vars.ALLOW_LIST }}
                REDIS_HOST=redis
                REDIS_PORT=6379
                REDIS_DB=0
                REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
                FLASK_HOST=0.0.0.0
                FLASK_PORT=8080
                FLASK_DEBUG=False
                LOG_LEVEL=INFO
                EOF
                chmod 600 .env

                # Login to Docker Hub without putting the token in argv
                echo '${{ secrets.DOCKERHUB_TOKEN }}' | \
                  docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin

                # Pull latest image
                docker pull geunsam2/korailbot:latest

                # Stop and remove old containers
                docker compose down

                # Start services with Docker Compose
                docker compose up -d

                # Show status
                echo "=== Docker Compose Status ==="
                docker compose ps
                echo ""
                echo "=== Recent Logs ==="
                docker compose logs --tail=30
