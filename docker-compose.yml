services:
  app:
    # Built locally by scripts/deploy.sh build. Set IMAGE_NAME in .env to run
    # an image you publish yourself instead; there is no shared registry image
    # to pull, on purpose - running a bot that handles Korail logins from an
    # image someone else controls is not a default anyone should inherit.
    image: ${IMAGE_NAME:-korailbot:local}
    container_name: ${APP_CONTAINER_NAME:-korail_bot}
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PYTHONUNBUFFERED=1
      - BOT_RUNTIME_PROFILE=${BOT_RUNTIME_PROFILE:-production}
    env_file:
      - ${BOT_ENV_FILE:-.env}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - korail_network

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-korail_redis}
    # Deliberately not published to the host: Redis holds user sessions and
    # encrypted credentials, and only the app container needs to reach it.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    env_file:
      - ${BOT_ENV_FILE:-.env}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel notice
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - korail_network

volumes:
  redis_data:
    driver: local

networks:
  korail_network:
    driver: bridge
