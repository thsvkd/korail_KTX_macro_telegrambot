name: CI/CD

# The `check` job deliberately references no secret. It has to run to
# completion on a pull request opened from a fork, where GitHub injects no
# secrets at all, otherwise an outside contributor has no way to tell whether
# their change is sound. Everything that needs a credential lives in `cicd`,
# which never runs on a pull request.
#
# Required repository secrets (cicd only):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   SSH_USERNAME, SSH_PASSWORD
#   TELEGRAM_BOTTOKEN          - bot token
#   SESSION_SECRET             - credential encryption key material
#   ADMIN_COMMAND_PASSWORD     - admin command password (NOT the Korail one)
#   REDIS_PASSWORD             - Redis AUTH password
#   ALLOW_LIST                 - phone numbers allowed to use the bot. A secret
#                                rather than a variable because GitHub masks
#                                `secrets.*` in run logs and `vars.*` not.
#   ADMIN_USERID, ADMIN_PASSWD - optional Korail account for the magic login
#   SRT_ID, SRT_PW             - optional SRT account for the magic login
#   ADMIN_MAGIC_STRING         - optional trigger for that shortcut
# Required repository variables (cicd only):
#   IMAGE_NAME                 - image to build and push, e.g. you/korailbot:latest.
#                                Unset means "this checkout is not the one that
#                                publishes"; the whole cicd job is skipped.
#   DEPLOY_HOST                - host to deploy to. Unset skips the deploy steps
#                                but still builds and pushes the image.
# Both used to be hardcoded to the upstream owner's Docker Hub namespace and
# personal server. They are variables now so that a fork cannot push to, or
# SSH into, infrastructure it does not own.

on:
    push:
        branches:
            - 'master'
    pull_request:
        branches:
            - 'master'
    workflow_dispatch:

# Least privilege. `check` executes code that arrived in a pull request -
# `uv sync` runs build backends and pytest runs the PR's own test files - so
# the token it gets should not be able to write anything.
permissions:
    contents: read

jobs:
  # Nothing is published or deployed until this passes. Before it existed a
  # push to master went straight to the server with no test having run.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
        # Pushing a fixup to a pull request should abandon the previous run
        # rather than queue behind it.
        group: check-${{ github.workflow }}-${{ github.ref }}
        cancel-in-progress: true
    steps:
    -
        name: Checkout
        uses: actions/checkout@v4
    -
        name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
            enable-cache: true
    -
        name: Install dependencies
        run: uv sync --frozen
    -
        name: Lint
        run: |
            uv run --frozen ruff format --check .
            uv run --frozen ruff check .
    -
        name: Unit tests
        # No Docker needed: conftest.py starts the throwaway Redis only for
        # the integration and e2e suites.
        run: uv run --frozen pytest tests/unit -q
    -
        name: Integration and e2e tests
        # Blocking. These used to be exempted for 16 failures inherited from a
        # batch of tests that was committed without ever being run; those are
        # now fixed, on both sides.
        run: uv run --frozen pytest tests/integration tests/e2e -q
    -
        name: Type check
        # Not blocking yet: 51 pre-existing errors in 11 files as of 2026-08-01,
        # mostly str|None reaching parameters typed int, concentrated in
        # handlers/conversation_handler.py and other legacy call sites. A failure
        # here does not stop a merge, so do not read a green tick on this job as
        # "mypy is clean". Drop continue-on-error once the backlog is cleared.
        continue-on-error: true
        run: uv run --frozen mypy

  cicd:
    needs: check
    # Three guards, each closing a different hole:
    #   - not a pull_request: a fork PR must never reach a step that reads a
    #     secret or pushes an image. GitHub already withholds secrets from fork
    #     PRs, but relying on empty credentials as the safety net is not a
    #     safety net.
    #   - master only: `workflow_dispatch` otherwise lets any branch be built
    #     and shipped to production without review.
    #   - this repository only: `on: push` fires in forks too, so without this
    #     a contributor who enables Actions on their fork starts deploying to
    #     someone else's server on every push to their own master.
    # vars.IMAGE_NAME acts as the opt-in: a checkout that has not been told
    # where to publish skips the job instead of failing loudly on every push.
    if: >-
        github.event_name != 'pull_request'
        && github.ref == 'refs/heads/master'
        && github.repository == 'thsvkd/korail_KTX_macro_telegrambot'
        && vars.IMAGE_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
        # Two pushes in quick succession must not run `docker compose down` and
        # `up -d` against the same host at the same time. Serialise instead of
        # cancelling: a half-applied deploy is worse than a slow one.
        group: deploy-production
        cancel-in-progress: false
    steps:
    -
        name: Checkout
        uses: actions/checkout@v4
    -
        name: Set up QEMU
        # Needed to build the arm64 image on an amd64 runner.
        uses: docker/setup-qemu-action@v3
    -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
    -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
    -
        name: Build Container Image
        uses: docker/build-push-action@v6
        with:
            context: .
            file: ./Dockerfile
            # arm64 as well as amd64, so the same published image runs on a
            # Raspberry Pi instead of only on the deployment server.
            platforms: linux/amd64,linux/arm64
            push: true
            tags: ${{ vars.IMAGE_NAME }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

    -
        name: Copy docker-compose.yml to server
        # Pinned to a release: @master would run whatever the action author
        # pushes next, with our deploy credentials.
        if: vars.DEPLOY_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
            host: ${{ vars.DEPLOY_HOST }}
            username: ${{ secrets.SSH_USERNAME }}
            password: ${{ secrets.SSH_PASSWORD }}
            port: 22
            source: "docker-compose.yml"
            target: "/home/${{ secrets.SSH_USERNAME }}/korail_bot/"

    -
        name: Deploy with Docker Compose
        if: vars.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
            host: ${{ vars.DEPLOY_HOST }}
            username: ${{ secrets.SSH_USERNAME }}
            password: ${{ secrets.SSH_PASSWORD }}
            port: 22
            timeout: 60s
            script: |
                cd /home/${{ secrets.SSH_USERNAME }}/korail_bot || exit 1

                # Create .env file with secrets.
                # Quoted heredoc: secret values are written literally instead
                # of being expanded by the remote shell.
                umask 077
                cat > .env << 'EOF'
                # The image compose runs. Without this, docker-compose.yml
                # falls back to korailbot:local - the tag a local build
                # produces - and the image pulled just above would sit unused
                # while compose failed to find one that was never built here.
                IMAGE_NAME=${{ vars.IMAGE_NAME }}
                BOTTOKEN=${{ secrets.TELEGRAM_BOTTOKEN }}
                SESSION_SECRET=${{ secrets.SESSION_SECRET }}
                ADMIN_PASSWORD=${{ secrets.ADMIN_COMMAND_PASSWORD }}
                ADMIN_MAGIC_STRING=${{ secrets.ADMIN_MAGIC_STRING }}
                USERID=${{ secrets.ADMIN_USERID }}
                USERPW=${{ secrets.ADMIN_PASSWD }}
                SRT_ID=${{ secrets.SRT_ID }}
                SRT_PW=${{ secrets.SRT_PW }}
                ALLOW_LIST=${{ secrets.ALLOW_LIST || vars.ALLOW_LIST }}
                REDIS_HOST=redis
                REDIS_PORT=6379
                REDIS_DB=0
                REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
                FLASK_HOST=0.0.0.0
                FLASK_PORT=8080
                FLASK_DEBUG=False
                LOG_LEVEL=INFO
                EOF
                chmod 600 .env

                # Login to Docker Hub without putting the token in argv
                echo '${{ secrets.DOCKERHUB_TOKEN }}' | \
                  docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin

                # Pull latest image
                docker pull '${{ vars.IMAGE_NAME }}'

                # Redis state moved from a named volume to a bind mount, so
                # that stopping or removing containers cannot take registered
                # accounts and running searches with them. A host that still
                # has the old volume would otherwise come up empty and silent:
                # stop instead, and say what to run.
                legacy="$(docker volume ls -q --filter name=_redis_data | head -n 1)"
                if [ -n "$legacy" ] && [ ! -d ./.data/redis/appendonlydir ]; then
                  echo "Redis data is still in the '$legacy' volume." >&2
                  echo "Move it once, from a checkout on this host:" >&2
                  echo "  scripts/migrate-redis.sh --from-volume $legacy" >&2
                  exit 1
                fi

                # Stop and remove old containers
                docker compose down

                # Start services with Docker Compose
                docker compose up -d

                # Show status. Deliberately no `docker compose logs`: this
                # repository is public, so the run log is public too, and the
                # application logs carry unmasked chat_id values.
                echo "=== Docker Compose Status ==="
                docker compose ps
